[project]
name = "csrcqsf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiohttp>=3.12.13",
    "anyio>=4.9.0",
    "apscheduler>=3.11.0",
    "asyncmy>=0.2.10",
    "bfrcommon>=1.0.24",
    "cryptography>=45.0.0",
    "fastapi==0.95.2",
    "grpcio>=1.71.2",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.12.0.88",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "pymilvus==2.6.3",
    "python-dotenv>=1.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.6",
    "requests>=2.32.5",
    "redis>=5.2.0",
    "urllib3>=2.6.0",
    "uvicorn==0.34.0",
    "xlsxwriter>=3.2.9",
    "tqdm>=4.70.0",
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "httpx>=0.27.0",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csrcqsf*"]

[[tool.uv.index]]
name = "bfr"
url = "http://120.79.158.19:8765/simple/"
default = true
