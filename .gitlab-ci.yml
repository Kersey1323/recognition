variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GITOPS_BRANCH: "$CI_DEFAULT_BRANCH"
  RUNTIME_DOCKERFILE: "Dockerfile"
  VENDOR_DOCKERFILE: "Dockerfile.vendor"
  PLATFORM_CI_DIR: "/home/ubuntu/project-train/buffalo-ci"
  GITOPS_REPO_URL: "http://192.168.100.3:8929/xi/gitops-demo.git"
  GITOPS_HOST_SUFFIX: "buffalo.com"
  PLATFORM_IMAGE_REGISTRY: "localhost:5000"
  PLATFORM_K8S_REGISTRY: "cicd-test-registry:5000"
  PLATFORM_DEPLOY_TIMEOUT_SECONDS: "300"

.vendor_release_rules: &vendor_release_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^\[vendor\]/'

default:
  tags:
    - shell
  before_script:
    - export PLATFORM_CI_DIR="${PLATFORM_CI_DIR:-/home/ubuntu/project-train/buffalo-ci}"
    - test -d "$PLATFORM_CI_DIR"
    - export APP_NAME="${GITOPS_APP_NAME:-$CI_PROJECT_NAME}"
    - export PROJECT_SLUG="${CI_PROJECT_PATH_SLUG:-$CI_PROJECT_NAME}"
    - export ROOT_GROUP_RAW="${CI_PROJECT_ROOT_NAMESPACE:-${CI_PROJECT_NAMESPACE%%/*}}"
    - export GROUP_INPUT="${GITOPS_GROUP:-$ROOT_GROUP_RAW}"
    - export GROUP_SLUG="$(printf '%s' "$GROUP_INPUT" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
    - export DOCKER_IMAGE_NAME="${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}"
    - export PUSH_REGISTRY_IMAGE="${PLATFORM_IMAGE_REGISTRY}/${PROJECT_SLUG}:${CI_COMMIT_SHORT_SHA}"
    - export PUSH_REGISTRY_IMAGE_LATEST="${PLATFORM_IMAGE_REGISTRY}/${PROJECT_SLUG}:latest"
    - export K8S_REGISTRY_IMAGE="${PLATFORM_K8S_REGISTRY}/${PROJECT_SLUG}:${CI_COMMIT_SHORT_SHA}"
    - export PLATFORM_RUNTIME_SCRIPT="$PLATFORM_CI_DIR/scripts/runtime/extract_metadata.sh"
    - export PLATFORM_GITOPS_BOOTSTRAP_SCRIPT="$PLATFORM_CI_DIR/scripts/gitops/bootstrap_app.sh"
    - export PLATFORM_GITOPS_UPDATE_SCRIPT="$PLATFORM_CI_DIR/scripts/gitops/update_app_descriptor.sh"
    - export PLATFORM_ROLLOUT_WAIT_SCRIPT="$PLATFORM_CI_DIR/scripts/gitops/wait_for_rollout.sh"

cache:
  paths:
    - .cache/pip

stages:
  - verify
  - image
  - deploy
  - verify-deploy

lint:
  stage: verify
  script:
    - bash scripts/ci/lint.sh

test:
  stage: verify
  script:
    - bash scripts/ci/test.sh

build:
  stage: verify
  script:
    - bash scripts/ci/build.sh

docker-build:
  stage: image
  script:
    - export DOCKERFILE_TO_USE="$VENDOR_DOCKERFILE"
    - if [ ! -f "$DOCKERFILE_TO_USE" ]; then export DOCKERFILE_TO_USE="$RUNTIME_DOCKERFILE"; fi
    - docker build -f "$DOCKERFILE_TO_USE" -t "$DOCKER_IMAGE_NAME" .
    - docker image inspect "$DOCKER_IMAGE_NAME" > /dev/null
  rules: *vendor_release_rules

docker-push:
  stage: image
  needs:
    - docker-build
  script:
    - docker tag "$DOCKER_IMAGE_NAME" "$PUSH_REGISTRY_IMAGE"
    - docker tag "$DOCKER_IMAGE_NAME" "$PUSH_REGISTRY_IMAGE_LATEST"
    - docker push "$PUSH_REGISTRY_IMAGE"
    - docker push "$PUSH_REGISTRY_IMAGE_LATEST"
  rules: *vendor_release_rules

gitops-bootstrap:
  stage: deploy
  needs:
    - docker-push
  script:
    - bash "$PLATFORM_GITOPS_BOOTSTRAP_SCRIPT"
  rules: *vendor_release_rules

gitops-update:
  stage: deploy
  needs:
    - gitops-bootstrap
  script:
    - bash "$PLATFORM_GITOPS_UPDATE_SCRIPT" "$K8S_REGISTRY_IMAGE"
  rules: *vendor_release_rules

deploy-verify:
  stage: verify-deploy
  needs:
    - gitops-update
  script:
    - bash "$PLATFORM_ROLLOUT_WAIT_SCRIPT"
  rules: *vendor_release_rules
