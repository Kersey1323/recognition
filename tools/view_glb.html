<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB 3D Viewer (Web Optimized)</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #0a0a0f;
            --poster-color: transparent;
        }

        #drop-zone {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            /* Let model-viewer handle interactions */
        }

        /* Only show drop UI when no model is loaded */
        model-viewer[src]+#drop-zone {
            opacity: 0;
        }

        .drop-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .drop-text {
            font-size: 18px;
            color: #888;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
            background: rgba(20, 20, 30, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="1" environment-image="neutral"
        exposure="1" tone-mapping="aces" alt="3D Model">
    </model-viewer>

    <div id="drop-zone">
        <div class="drop-icon">🌐</div>
        <div class="drop-text">拖拽 .glb 文件到这里</div>
    </div>

    <div id="controls">
        <button
            onclick="document.getElementById('viewer').autoRotate = !document.getElementById('viewer').autoRotate">自动旋转</button>
        <button onclick="document.getElementById('viewer').cameraOrbit = '0deg 75deg 105%'">重置视角</button>
    </div>

    <script>
        const viewer = document.getElementById('viewer');
        const dropZone = document.getElementById('drop-zone');

        // 拖拽处理
        document.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.style.opacity = '1';
            dropZone.style.backgroundColor = 'rgba(99, 102, 241, 0.1)';
        });

        document.addEventListener('dragleave', (event) => {
            dropZone.style.backgroundColor = 'transparent';
            if (viewer.src) dropZone.style.opacity = '0';
        });

        document.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.style.backgroundColor = 'transparent';

            const file = event.dataTransfer.files[0];
            if (file && file.name.toLowerCase().endsWith('.glb')) {
                const url = URL.createObjectURL(file);
                viewer.src = url;
                dropZone.style.opacity = '0';
            } else {
                alert('请拖入 .glb 文件');
            }
        });
    </script>

</body>

</html>
