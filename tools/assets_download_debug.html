<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件下载代理调试页</title>
  <style>
    :root {
      --bg: #f4efe7;
      --panel: #fffdf8;
      --line: #ddd2c3;
      --text: #2d261f;
      --muted: #6c6358;
      --accent: #9f4526;
      --accent-2: #315d61;
      --danger: #8a2f2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(159, 69, 38, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(49, 93, 97, 0.14), transparent 26%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      width: min(1160px, calc(100vw - 32px));
      margin: 28px auto;
      display: grid;
      gap: 20px;
    }

    .hero, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(45, 38, 31, 0.08);
    }

    .hero {
      padding: 24px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .hero p {
      margin: 0;
      line-height: 1.7;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 20px;
    }

    .panel {
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 14px;
      color: var(--muted);
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }

    button.secondary {
      background: var(--accent-2);
    }

    button.ghost {
      background: #7b7369;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(159, 69, 38, 0.1);
      color: var(--accent);
    }

    .meta {
      display: grid;
      gap: 8px;
      font-size: 14px;
      margin-top: 14px;
    }

    .meta code,
    .log code {
      font-family: "JetBrains Mono", "Consolas", monospace;
    }

    .preview-shell {
      display: grid;
      gap: 14px;
    }

    .preview-box {
      min-height: 340px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,239,231,0.85));
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 14px;
    }

    .preview-box img,
    .preview-box video {
      max-width: 100%;
      max-height: 480px;
      border-radius: 10px;
      display: none;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .download-link {
      display: none;
      color: var(--accent-2);
      font-weight: 600;
      text-decoration: none;
    }

    .download-link:hover {
      text-decoration: underline;
    }

    .log {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.7;
      background: #1d1b18;
      color: #f8f3e8;
      padding: 14px;
      border-radius: 12px;
      min-height: 240px;
      max-height: 480px;
      overflow: auto;
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>文件下载代理调试页</h1>
      <p>
        这个页面用于验证 <code>/{bucket}/{object}</code> 下载链路是否可用。
        页面会带上 <code>Authorization: Bearer</code> 发起 <code>fetch</code>，
        经过主业务鉴权，再由 Nginx 按 <code>X-Accel-Redirect</code> 内部回源 MinIO。
      </p>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>请求配置</h2>

        <div class="field">
          <label for="baseUrl">页面访问基地址</label>
          <input id="baseUrl" value="http://127.0.0.1:8080">
        </div>

        <div class="field">
          <label for="assetPath">文件路径</label>
          <textarea id="assetPath">/bfr-3d-videos/raw-videos/demo.mp4
/bfr-reconstruction-files/results/demo/point_cloud.ply</textarea>
        </div>

        <div class="field">
          <label for="authToken">SGO Token</label>
          <input id="authToken" value="">
        </div>

        <div class="actions">
          <button id="previewBtn">预览 / 下载</button>
          <button id="downloadBtn" class="secondary">仅下载</button>
          <button id="clearBtn" class="ghost">清空日志</button>
        </div>

        <div class="meta">
          <div>状态：<span class="status" id="statusText">空闲</span></div>
          <div>完整请求地址：<code id="resolvedUrl">-</code></div>
          <div>响应类型：<code id="contentType">-</code></div>
          <div>字节大小：<code id="contentLength">-</code></div>
        </div>
      </section>

      <section class="panel">
        <h2>结果预览</h2>
        <div class="preview-shell">
          <div class="preview-box">
            <div class="empty" id="emptyState">
              这里会显示图片或视频预览。<br>
              如果是其他类型文件，会生成下载链接。
            </div>
            <img id="previewImage" alt="预览图片">
            <video id="previewVideo" controls playsinline></video>
            <a id="downloadLink" class="download-link" download>下载返回文件</a>
          </div>
          <div class="log" id="logOutput"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const defaultAssetPath = "/bfr-3d-videos/raw-videos/demo.mp4";

    const baseUrlEl = document.getElementById("baseUrl");
    const assetPathEl = document.getElementById("assetPath");
    const authTokenEl = document.getElementById("authToken");
    const previewBtn = document.getElementById("previewBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusTextEl = document.getElementById("statusText");
    const resolvedUrlEl = document.getElementById("resolvedUrl");
    const contentTypeEl = document.getElementById("contentType");
    const contentLengthEl = document.getElementById("contentLength");
    const logOutputEl = document.getElementById("logOutput");
    const emptyStateEl = document.getElementById("emptyState");
    const previewImageEl = document.getElementById("previewImage");
    const previewVideoEl = document.getElementById("previewVideo");
    const downloadLinkEl = document.getElementById("downloadLink");

    let currentObjectUrl = "";

    function log(title, payload) {
      const timestamp = new Date().toLocaleTimeString();
      const message = payload === undefined
        ? `[${timestamp}] ${title}`
        : `[${timestamp}] ${title}\n${JSON.stringify(payload, null, 2)}`;
      logOutputEl.textContent = `${logOutputEl.textContent}${message}\n\n`;
      logOutputEl.scrollTop = logOutputEl.scrollHeight;
    }

    function setStatus(text, isError = false) {
      statusTextEl.textContent = text;
      statusTextEl.classList.toggle("error", isError);
    }

    function resetPreview() {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = "";
      }
      previewImageEl.style.display = "none";
      previewVideoEl.style.display = "none";
      previewVideoEl.pause();
      previewVideoEl.removeAttribute("src");
      previewImageEl.removeAttribute("src");
      downloadLinkEl.style.display = "none";
      downloadLinkEl.removeAttribute("href");
      emptyStateEl.style.display = "block";
      contentTypeEl.textContent = "-";
      contentLengthEl.textContent = "-";
    }

    function normalizeUrl(baseUrl, assetPath) {
      const root = String(baseUrl || "").trim().replace(/\/+$/, "");
      let path = String(assetPath || "").trim();
      if (!path.startsWith("/")) {
        path = `/${path}`;
      }
      return `${root}${path}`;
    }

    function buildHeaders() {
      const headers = {
        "accept": "*/*",
      };
      const token = authTokenEl.value.trim();
      if (token) {
        headers["Authorization"] = `Bearer ${token}`;
      }
      return headers;
    }

    async function fetchAsset() {
      const url = normalizeUrl(baseUrlEl.value, assetPathEl.value);
      const headers = buildHeaders();
      resolvedUrlEl.textContent = url;
      log("请求文件", { url });
      const response = await fetch(url, {
        method: "GET",
        headers,
      });
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errorText}`);
      }
      const blob = await response.blob();
      return {
        blob,
        contentType: response.headers.get("content-type") || blob.type || "",
        contentLength: response.headers.get("content-length") || blob.size || 0,
        filename: guessFilename(url, response.headers.get("content-disposition")),
      };
    }

    function guessFilename(url, disposition) {
      if (disposition) {
        const match = disposition.match(/filename\\*=UTF-8''([^;]+)|filename=\"?([^\";]+)\"?/i);
        if (match) {
          return decodeURIComponent(match[1] || match[2] || "download.bin");
        }
      }
      const parts = url.split("/");
      return parts[parts.length - 1] || "download.bin";
    }

    function applyPreview(blob, contentType, filename, forceDownload) {
      resetPreview();
      const objectUrl = URL.createObjectURL(blob);
      currentObjectUrl = objectUrl;
      contentTypeEl.textContent = contentType || "-";
      contentLengthEl.textContent = String(blob.size || "-");

      if (!forceDownload && contentType.startsWith("image/")) {
        previewImageEl.src = objectUrl;
        previewImageEl.style.display = "block";
        emptyStateEl.style.display = "none";
        return;
      }

      if (!forceDownload && contentType.startsWith("video/")) {
        previewVideoEl.src = objectUrl;
        previewVideoEl.style.display = "block";
        emptyStateEl.style.display = "none";
        return;
      }

      downloadLinkEl.href = objectUrl;
      downloadLinkEl.download = filename;
      downloadLinkEl.textContent = `下载 ${filename}`;
      downloadLinkEl.style.display = "inline-block";
      emptyStateEl.style.display = "none";
    }

    async function run(forceDownload) {
      try {
        previewBtn.disabled = true;
        downloadBtn.disabled = true;
        setStatus("请求中");
        const result = await fetchAsset();
        log("响应成功", {
          content_type: result.contentType,
          size: result.blob.size,
          filename: result.filename,
        });
        applyPreview(
          result.blob,
          result.contentType,
          result.filename,
          forceDownload
        );
        setStatus(forceDownload ? "已生成下载链接" : "已完成");
      } catch (error) {
        log("请求失败", { message: error.message });
        setStatus("请求失败", true);
      } finally {
        previewBtn.disabled = false;
        downloadBtn.disabled = false;
      }
    }

    previewBtn.addEventListener("click", () => run(false));
    downloadBtn.addEventListener("click", () => run(true));
    clearBtn.addEventListener("click", () => {
      logOutputEl.textContent = "";
      resetPreview();
      setStatus("空闲");
      resolvedUrlEl.textContent = "-";
    });

    resetPreview();
    log("调试页已就绪");
  </script>
</body>
</html>
