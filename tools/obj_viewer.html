<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJ 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    overflow: hidden;
    height: 100vh;
  }

  #canvas-container {
    width: 100%;
    height: 100%;
    position: relative;
  }

  canvas { display: block; }

  /* 拖拽区域 */
  #drop-zone {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: background 0.3s;
  }

  #drop-zone.has-model { pointer-events: none; opacity: 0; }
  #drop-zone.drag-over { background: rgba(99, 102, 241, 0.15); }

  .drop-icon {
    width: 80px; height: 80px;
    border: 3px dashed rgba(99, 102, 241, 0.5);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    font-size: 36px;
    color: rgba(99, 102, 241, 0.7);
    transition: all 0.3s;
  }

  #drop-zone.drag-over .drop-icon {
    border-color: #6366f1;
    color: #6366f1;
    transform: scale(1.1);
  }

  .drop-text { font-size: 18px; color: #888; margin-bottom: 8px; }
  .drop-hint { font-size: 13px; color: #555; }

  /* 信息面板 */
  #info-panel {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 13px;
    z-index: 20;
    min-width: 200px;
    display: none;
  }

  #info-panel.visible { display: block; }

  #info-panel h3 {
    font-size: 14px;
    color: #6366f1;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .info-label { color: #888; }
  .info-value { color: #e0e0e0; font-weight: 500; }

  /* 控制栏 */
  #controls {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 12px;
    padding: 10px 20px;
    z-index: 20;
    display: none;
    gap: 12px;
    align-items: center;
    font-size: 12px;
    color: #888;
  }

  #controls.visible { display: flex; }

  .ctrl-btn {
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #a5b4fc;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }

  .ctrl-btn:hover {
    background: rgba(99, 102, 241, 0.3);
    border-color: #6366f1;
    color: #fff;
  }

  /* 加载指示器 */
  #loader {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.8);
    z-index: 30;
  }

  #loader.active { display: flex; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(99, 102, 241, 0.2);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 重新加载按钮 */
  #reload-btn {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 20;
    display: none;
  }

  #reload-btn.visible { display: block; }
</style>
</head>
<body>

<div id="canvas-container">
  <div id="drop-zone">
    <div class="drop-icon">📦</div>
    <div class="drop-text">拖拽 OBJ 文件到这里</div>
    <div class="drop-hint">支持 .obj + .mtl + .png 纹理 (同时拖入)</div>
  </div>

  <div id="loader"><div class="spinner"></div></div>

  <div id="info-panel">
    <h3>📊 模型信息</h3>
    <div class="info-row"><span class="info-label">文件名</span><span class="info-value" id="info-name">-</span></div>
    <div class="info-row"><span class="info-label">顶点数</span><span class="info-value" id="info-verts">-</span></div>
    <div class="info-row"><span class="info-label">面数</span><span class="info-value" id="info-faces">-</span></div>
    <div class="info-row"><span class="info-label">尺寸</span><span class="info-value" id="info-size">-</span></div>
  </div>

  <div id="controls">
    <span>🖱 左键旋转 · 右键平移 · 滚轮缩放</span>
    <button class="ctrl-btn" onclick="resetCamera()">重置视角</button>
    <button class="ctrl-btn" onclick="toggleWireframe()">线框</button>
    <button class="ctrl-btn" onclick="toggleGrid()">网格</button>
    <button class="ctrl-btn" id="reload-btn" onclick="location.reload()">重新加载</button>
  </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/MTLLoader.js"></script>

<script>
let scene, camera, renderer, controls, currentModel, gridHelper;
let wireframeMode = false;

// 初始化场景
function init() {
  scene = new THREE.Scene();

  // 渐变背景
  scene.background = new THREE.Color(0x0a0a0f);

  // 相机
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(3, 2, 3);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // 控制器
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // 灯光
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight1.position.set(5, 8, 5);
  dirLight1.castShadow = true;
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0x6366f1, 0.3);
  dirLight2.position.set(-3, 4, -5);
  scene.add(dirLight2);

  const hemiLight = new THREE.HemisphereLight(0x6366f1, 0x1a1a2e, 0.3);
  scene.add(hemiLight);

  // 网格
  gridHelper = new THREE.GridHelper(10, 20, 0x222233, 0x151520);
  scene.add(gridHelper);

  // 窗口大小变化
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// 拖拽处理
const dropZone = document.getElementById('drop-zone');

['dragenter', 'dragover'].forEach(e => {
  document.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.add('drag-over'); });
});

['dragleave', 'drop'].forEach(e => {
  document.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.remove('drag-over'); });
});

document.addEventListener('drop', handleDrop);

function handleDrop(e) {
  const files = Array.from(e.dataTransfer.files);
  if (!files.length) return;

  const fileMap = {};
  files.forEach(f => { fileMap[f.name] = f; });

  const objFile = files.find(f => f.name.endsWith('.obj'));
  if (!objFile) { alert('请拖入 .obj 文件'); return; }

  document.getElementById('loader').classList.add('active');

  // MTL 文件
  const mtlFile = files.find(f => f.name.endsWith('.mtl'));
  // 纹理文件
  const texFiles = files.filter(f => /\.(png|jpg|jpeg|bmp|tga)$/i.test(f.name));

  loadOBJ(objFile, mtlFile, texFiles);
}

function loadOBJ(objFile, mtlFile, texFiles) {
  // 创建 blob URL map (用于纹理查找)
  const blobURLs = {};
  const allFiles = [objFile, mtlFile, ...texFiles].filter(Boolean);
  allFiles.forEach(f => { blobURLs[f.name] = URL.createObjectURL(f); });

  const loadModel = (materials) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const loader = new THREE.OBJLoader();
      if (materials) loader.setMaterials(materials);

      try {
        const obj = loader.parse(e.target.result);
        addModel(obj, objFile.name);
      } catch (err) {
        alert('OBJ 解析失败: ' + err.message);
      }
      document.getElementById('loader').classList.remove('active');
    };
    reader.readAsText(objFile);
  };

  if (mtlFile) {
    const mtlReader = new FileReader();
    mtlReader.onload = (e) => {
      const mtlLoader = new THREE.MTLLoader();

      // 自定义纹理加载
      mtlLoader.setResourcePath('');
      const materials = mtlLoader.parse(e.target.result, '');

      // 替换纹理路径为 blob URL
      Object.values(materials.materials).forEach(mat => {
        if (mat.map && mat.map.sourceFile) {
          const texName = mat.map.sourceFile.split('/').pop();
          if (blobURLs[texName]) {
            mat.map = new THREE.TextureLoader().load(blobURLs[texName]);
            mat.map.wrapS = THREE.RepeatWrapping;
            mat.map.wrapT = THREE.RepeatWrapping;
          }
        }
      });

      materials.preload();
      loadModel(materials);
    };
    mtlReader.readAsText(mtlFile);
  } else {
    loadModel(null);
  }
}

function addModel(obj, filename) {
  // 移除旧模型
  if (currentModel) scene.remove(currentModel);

  currentModel = obj;

  // 如果没有材质，使用默认材质
  let totalVertices = 0, totalFaces = 0;
  obj.traverse((child) => {
    if (child.isMesh) {
      if (!child.material || (child.material.color && child.material.color.r === 1 && child.material.color.g === 1 && child.material.color.b === 1 && !child.material.map)) {
        child.material = new THREE.MeshStandardMaterial({
          color: 0x8888cc,
          metalness: 0.2,
          roughness: 0.6,
          side: THREE.DoubleSide,
        });
      }
      child.castShadow = true;
      child.receiveShadow = true;

      if (child.geometry) {
        const geo = child.geometry;
        totalVertices += geo.attributes.position ? geo.attributes.position.count : 0;
        totalFaces += geo.index ? geo.index.count / 3 : (geo.attributes.position ? geo.attributes.position.count / 3 : 0);
      }
    }
  });

  // 居中和缩放
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3 / maxDim;

  obj.position.sub(center);
  obj.scale.setScalar(scale);

  scene.add(obj);

  // 更新相机
  resetCamera();

  // 更新 UI
  dropZone.classList.add('has-model');
  document.getElementById('info-panel').classList.add('visible');
  document.getElementById('controls').classList.add('visible');

  document.getElementById('info-name').textContent = filename;
  document.getElementById('info-verts').textContent = totalVertices.toLocaleString();
  document.getElementById('info-faces').textContent = Math.round(totalFaces).toLocaleString();
  document.getElementById('info-size').textContent =
    `${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`;
}

function resetCamera() {
  camera.position.set(3, 2, 3);
  controls.target.set(0, 0, 0);
  controls.update();
}

function toggleWireframe() {
  wireframeMode = !wireframeMode;
  if (currentModel) {
    currentModel.traverse((child) => {
      if (child.isMesh) child.material.wireframe = wireframeMode;
    });
  }
}

function toggleGrid() {
  gridHelper.visible = !gridHelper.visible;
}

init();
</script>
</body>
</html>
