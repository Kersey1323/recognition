<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINOv2 / SigLIP · 图片检索对照</title>
<style>
:root{--ink:#203347;--muted:#65798c;--line:#d7e0e7;--paper:#f0f5f8;--white:#fff;--dino:#007d76;--siglip:#b65e2c;--blue:#205b96}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 90% 0%,#dcecf2,transparent 55%),var(--paper);font:14px/1.6 "Noto Sans CJK SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:5px;padding:7px 11px;color:var(--ink)}button:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #64a6d8;outline-offset:2px}button:disabled{opacity:.4;cursor:default}a{color:var(--blue)}h1,h2,h3,p{margin:0}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:12px}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:12px;white-space:nowrap}.dino{color:var(--dino)}.siglip{color:var(--siglip)}
header{padding:22px 28px 18px;background:#fff;border-top:5px solid var(--dino);border-bottom:1px solid var(--line)}.masthead{max-width:1750px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font:600 26px/1.3 "Noto Serif CJK SC","Source Han Serif SC",serif;letter-spacing:.02em}header p{margin-top:8px;color:var(--muted)}.model-mark{display:flex;gap:9px;align-items:center;font-size:16px;white-space:nowrap}.model-mark span{padding:9px 13px;border:1px solid var(--line);border-top:3px solid currentColor}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1800px;margin:auto}aside{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px;border-right:1px solid var(--line);background:#eaf1f5}aside input,aside select{width:100%;padding:9px;border:1px solid #c4d1dd;border-radius:5px;background:white;color:var(--ink);margin-bottom:9px}.nav-count{font-size:12px;color:var(--muted);margin:6px 5px 9px}.nav-item{display:block;text-align:left;width:100%;background:transparent;border-color:transparent;margin-bottom:5px;padding:9px 10px}.nav-item.active{border-color:#98afc1;background:white;box-shadow:inset 3px 0 var(--blue)}.nav-item b{font-weight:600}.nav-item small{display:block;color:var(--muted);font-size:11px}.nav-item .nav-rank{display:flex;justify-content:space-between;gap:6px;margin-bottom:4px;font-size:12px}main{padding:22px 25px 40px;min-width:0}.sample-heading{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:14px}h2{font-size:24px;line-height:1.4;margin:5px 0}.arrows{display:flex;gap:7px}.context{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:8px;font-size:13px}.context b{font-weight:500;color:var(--muted);margin-right:7px}.instruction{padding:10px 13px;background:#e3edf4;border-left:3px solid #7f9fb6;font-size:12px;margin-bottom:17px}.inputs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.panel{background:var(--white);border:1px solid var(--line);border-radius:7px;min-width:0;overflow:hidden}.panel-title{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}h3{font-size:15px}.filmstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;max-height:330px;overflow:auto}.filmstrip.expanded{max-height:680px}figure{margin:0;min-width:0}.picture{display:block;border:1px solid #e2e8ed;padding:0;background:repeating-linear-gradient(45deg,#f8fafb,#f8fafb 10px,#f3f6f8 10px,#f3f6f8 20px);width:100%;border-radius:4px;overflow:hidden}.picture img{display:block;width:100%;height:140px;object-fit:contain}.picture:hover{border-color:var(--blue)}figcaption{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.more{padding:0 12px 12px}.retrievals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:20px}.model-panel{border-top:4px solid var(--dino)}.model-panel.siglip-panel{border-top-color:var(--siglip)}.model-heading{padding:13px 14px 9px;display:flex;justify-content:space-between;gap:8px;align-items:start}.model-heading h3{font-size:20px;font-family:"DejaVu Sans Mono",Consolas,monospace}.outcome{font-weight:600;margin-top:5px}.outcome.miss{color:var(--muted)}.rank-detail{font-size:12px;color:var(--muted);min-height:20px}.model-actions{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}.candidate-list{max-height:860px;overflow:auto;border-top:1px solid var(--line);padding:11px;display:grid;gap:10px}.candidate{display:grid;grid-template-columns:155px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:5px;padding:9px;background:white}.candidate.answer{border-color:#218879;background:#edf8f5}.candidate .picture img{height:145px}.candidate-title{font-size:15px;font-weight:600;margin:5px 0}.candidate-code{overflow-wrap:anywhere}.candidate-top{display:flex;justify-content:space-between;gap:5px;font-size:12px}.candidate .rate{color:var(--muted);font-size:11px}.candidate .tag{background:white;margin:7px 0 4px}.candidate-note{font-size:11px;color:var(--muted);margin-top:8px}.candidate button.compare{margin-top:9px;font-size:12px;padding:4px 9px}.review{padding:14px;margin-top:18px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:15px;align-items:start}.review label{cursor:pointer}.review textarea{width:100%;min-height:80px;resize:vertical;padding:9px;border:1px solid var(--line);border-radius:4px}.review small{display:block;color:var(--muted);margin-top:5px}.empty{padding:40px;text-align:center;color:var(--muted)}footer{font-size:11px;color:var(--muted);padding-top:16px}
dialog{padding:0;border:1px solid #abc0d0;border-radius:8px;width:min(1500px,96vw);max-height:95vh;color:var(--ink);background:#f4f7f9}dialog::backdrop{background:#142c42d4}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 17px;background:white;border-bottom:1px solid var(--line)}.zoom-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:15px}.zoom-pane{min-width:0}.zoom-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.zoom-tools select{max-width:100%;min-width:130px;padding:6px;border:1px solid var(--line);background:white;border-radius:4px}.zoom-image-box{height:57vh;background:white;border:1px solid var(--line);overflow:auto;display:flex;align-items:center;justify-content:center}.zoom-image-box img{width:100%;height:100%;object-fit:contain}.zoom-image-box.actual{display:block}.zoom-image-box.actual img{width:auto;height:auto;max-width:none}.zoom-meta{font-size:11px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}.zoom-single .zoom-grid{grid-template-columns:1fr}.zoom-single .right-pane{display:none}
@media(min-width:1650px){.picture img{height:170px}.candidate{grid-template-columns:190px minmax(0,1fr)}.candidate .picture img{height:170px}}
@media(max-width:1100px){.shell{grid-template-columns:205px minmax(0,1fr)}main{padding:18px}.candidate{grid-template-columns:115px minmax(0,1fr);gap:9px}.candidate .picture img{height:125px}.candidate-title{font-size:14px}.filmstrip{grid-template-columns:repeat(2,minmax(0,1fr))}.model-heading{flex-wrap:wrap}.model-heading h3{font-size:17px}}
@media(max-width:760px){header{padding:18px}.masthead{align-items:start}.model-mark{display:none}h1{font-size:23px}.shell{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters input{grid-column:1/-1}.filters input,.filters select{margin:0}#nav{display:flex;overflow:auto;gap:5px;max-height:130px}.nav-item{flex:0 0 190px;margin:0}.nav-count{margin-bottom:6px}main{padding:15px}.inputs,.retrievals{grid-template-columns:1fr}.filmstrip{grid-template-columns:repeat(3,minmax(0,1fr));max-height:245px}.picture img{height:110px}.sample-heading{flex-wrap:wrap}h2{font-size:22px}.candidate{grid-template-columns:130px minmax(0,1fr)}.candidate-list{max-height:650px}.review{grid-template-columns:1fr;gap:8px}.zoom-grid{grid-template-columns:1fr}.zoom-image-box{height:32vh}.zoom-single .zoom-image-box{height:65vh}.dialog-head{padding:10px}dialog{width:98vw;max-height:97vh}}
@media(prefers-reduced-motion:no-preference){main{animation:appear .2s ease-out}@keyframes appear{from{opacity:.6}to{opacity:1}}}
</style>
</head>
<body>
<header><div class="masthead"><div><h1>哪些配件，只被一种模型找到？</h1><p id="summary"></p></div><div class="model-mark"><span class="dino">DINOv2</span><span class="muted">/</span><span class="siglip">SigLIP</span></div></div></header>
<div class="shell"><aside><div class="filters"><input id="search" aria-label="搜索询码单、名称、编码" placeholder="搜索询码单、名称、编码"><select id="group" aria-label="选择对照组"><option value="all">全部 50 条</option><option value="dino">仅 DINOv2 命中的 25 条</option><option value="siglip">仅 SigLIP 命中的 25 条</option></select><select id="review-filter" aria-label="查看状态"><option value="all">全部查看状态</option><option value="no">未查看</option><option value="yes">已查看</option></select></div><div id="nav-count" class="nav-count"></div><nav id="nav" aria-label="询码样本"></nav></aside><main id="main"></main></div>
<dialog id="zoom"><div class="dialog-head"><b id="zoom-title">图片对照</b><div><button id="actual">查看原始尺寸</button> <button id="close-zoom">关闭 · Esc</button></div></div><div class="zoom-grid"><section class="zoom-pane"><div class="zoom-tools"><b>询码图片</b><select id="zoom-query-select" aria-label="选择询码图"></select></div><div class="zoom-image-box"><img id="zoom-query" alt="询码原图"></div><p class="zoom-meta" id="zoom-query-meta"></p></section><section class="zoom-pane right-pane"><div class="zoom-tools"><b>图库图片</b><button id="prev-image">上一张</button><select id="zoom-gallery-select" aria-label="选择图库图"></select><button id="next-image">下一张</button></div><div class="zoom-image-box"><img id="zoom-gallery" alt="图库原图"></div><p class="zoom-meta" id="zoom-gallery-meta"></p></section></div></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imageUrl=(key,original=false)=>`/images/${encodeURIComponent(key)}${original?'?original=true':''}`;
const sourceName=key=>({QUERY:'询码现场图',BASEINFO:'基础信息图片',CREATEBYSELF:'人工上传图片'}[DATA.images[key].source]||DATA.images[key].source);
const STORAGE='image-model-comparison-20261023-v1';let notes={};try{notes=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){}
let selected=0,visible=[],limits={dino:5,siglip:5},referenceAll=false,zoomKeys=[],zoomIndex=0;
const current=()=>DATA.samples[selected];
function groupName(group){return group==='dino'?'只有 DINOv2 进入前20名':'只有 SigLIP 进入前20名'}
function rankText(model){return model.rank!==null&&model.rank<=20?`第 ${model.rank} 名`:'前20未命中'}
function detailText(model){if(model.rank!==null)return model.rank<=20?'正确编码进入前20名':`正确编码在返回列表第 ${model.rank} 名，超出前20`;return model.full_rank!==null?`正确编码在完整图库排名第 ${model.full_rank} 名`:'接口返回列表中没有正确编码'}
function figure(key,label,context,position=0){return `<figure><button class="picture" data-image="${key}" data-context="${esc(context)}" data-position="${position}" title="点击放大"><img src="${imageUrl(key)}" alt="${esc(label)}" loading="lazy"></button><figcaption>${esc(label)}</figcaption></figure>`}
function filtered(){const q=$('search').value.trim().toLowerCase(),group=$('group').value,review=$('review-filter').value;return DATA.samples.map((s,i)=>i).filter(i=>{const s=DATA.samples[i],seen=!!notes[s.inquiry_id]?.seen;return(group==='all'||s.group===group)&&(review==='all'||seen===(review==='yes'))&&(!q||[s.inquiry_num,s.expected_name,s.expected_code,s.description].join(' ').toLowerCase().includes(q))})}
function renderNav(){visible=filtered();$('nav-count').textContent=`显示 ${visible.length} / ${DATA.samples.length} 条 · 已查看 ${DATA.samples.filter(s=>notes[s.inquiry_id]?.seen).length} 条`;$('nav').innerHTML=visible.map(i=>{const s=DATA.samples[i],model=s.group==='dino'?'DINOv2':'SigLIP',rank=s[s.group].rank;return `<button class="nav-item ${i===selected?'active':''}" data-sample="${i}" ${i===selected?'aria-current="true"':''}><span class="nav-rank"><span class="${s.group}">${model} 第${rank}名</span><span>${notes[s.inquiry_id]?.seen?'已查看':''}</span></span><b>${esc(s.expected_name)}</b><small class="mono">${esc(s.inquiry_num)}</small></button>`}).join('')||'<p class="empty">没有符合条件的样本</p>'}
function candidateCard(candidate,model){const s=current(),correct=candidate.item_code===s.expected_code;return `<article class="candidate ${correct?'answer':''}" id="${model}-candidate-${candidate.rank}">${figure(candidate.images[0],sourceName(candidate.images[0]),`${model}:${candidate.rank}`,0)}<div><div class="candidate-top"><b>#${candidate.rank}</b><span class="rate">相似度 ${candidate.score.toFixed(4)}</span></div><p class="candidate-title">${esc(candidate.item_name)}</p><p class="candidate-code mono">${esc(candidate.item_code)}</p>${correct?'<span class="tag">正确编码</span>':''}<p class="candidate-note">${candidate.images.length>1?`${candidate.images.length} 张匹配图片 · `:''}${candidate.query_indexes.length?`对应询码图 ${candidate.query_indexes.map(i=>i+1).join('、')}`:''}</p><button class="compare" data-compare="${model}:${candidate.rank}">与询码图并排看</button></div></article>`}
function renderModel(model){const s=current(),m=s[model],name=model==='dino'?'DINOv2':'SigLIP',found=m.rank!==null&&m.rank<=20;return `<section class="panel model-panel ${model==='siglip'?'siglip-panel':''}"><div class="model-heading"><div><h3 class="${model}">${name}</h3><div class="outcome ${found?model:'miss'}">正确配件：${rankText(m)}</div><div class="rank-detail">${detailText(m)}</div></div><span class="tag">${limits[model]===20?'前20个候选':'前5个候选'}</span></div><div class="model-actions"><button data-toggle-model="${model}">${limits[model]===20?'收起为前5名':'展开前20名'}</button>${found?`<button data-locate="${model}">定位正确配件 #${m.rank}</button>`:''}</div><div class="candidate-list" id="${model}-list">${m.candidates.slice(0,limits[model]).map(c=>candidateCard(c,model)).join('')}</div></section>`}
function renderReferences(){const s=current(),keys=referenceAll?s.reference_images:s.reference_images.slice(0,6);return `<section class="panel"><div class="panel-title"><h3>正确配件的参考图库</h3><span class="tag">${s.reference_images.length} 张</span></div><div class="filmstrip ${referenceAll?'expanded':''}">${keys.map((key,i)=>figure(key,`${sourceName(key)} · ${i+1}`,'reference',i)).join('')}</div>${s.reference_images.length>6?`<div class="more"><button id="toggle-reference">${referenceAll?'收起':'查看全部 '+s.reference_images.length+' 张'}</button></div>`:''}</section>`}
function renderMain(){const s=current(),r=notes[s.inquiry_id]||{},pos=visible.indexOf(selected);$('main').innerHTML=`<div class="sample-heading"><div><div class="small ${s.group}">${groupName(s.group)} · <span class="mono">${esc(s.inquiry_num)}</span></div><h2>${esc(s.expected_name)}</h2><div class="mono">正确编码 ${esc(s.expected_code)}</div><div class="context"><span><b>原始描述</b>${esc(s.description||'未提供')}</span><span><b>车型</b>${esc(s.vehicle||'未提供')}</span><span><b>询码日期</b>${esc(s.inquiry_time||'未提供')}</span>${s.component?`<span><b>隶属部件</b>${esc(s.component)}</span>`:''}</div>${s.remark?`<p class="small muted" style="margin-top:7px">备注：${esc(s.remark)}</p>`:''}</div><div class="arrows"><button id="previous" ${pos<=0?'disabled':''}>上一条</button><button id="next" ${pos===visible.length-1?'disabled':''}>下一条</button></div></div><p class="instruction">“命中”按正确编码进入前20名判断。下方参考图库用于人工对照；两种模型实际返回的候选分别列出。名称和车型仅供你看，本次检索只输入图片。两种模型的相似度分数不能直接比较。</p><div class="inputs"><section class="panel"><div class="panel-title"><h3>询码现场图片</h3><span class="tag">${s.query_images.length} 张</span></div><div class="filmstrip">${s.query_images.map((key,i)=>figure(key,`询码图 ${i+1}`,'query',i)).join('')}</div></section><div id="references">${renderReferences()}</div></div><div class="retrievals" id="retrievals">${renderModel('dino')}${renderModel('siglip')}</div><section class="panel review"><div><label><input type="checkbox" id="seen" ${r.seen?'checked':''}> 这条我已查看</label><small id="save-state">备注自动保存在当前浏览器</small></div><textarea id="note" aria-label="对照分析备注" placeholder="你的判断：两边的图片、背景、拍摄角度或相似配件有什么区别？">${esc(r.note||'')}</textarea></section><footer>每组展示 ${DATA.selected_per_group} 条，组内优先选择不同的正确编码。完整数据中：仅 DINOv2 命中 ${DATA.available.dino} 条，仅 SigLIP 命中 ${DATA.available.siglip} 条。本页用于逐条看图，不作为新的整体指标。</footer>`}
function selectSample(i){selected=i;limits={dino:5,siglip:5};referenceAll=false;renderNav();renderMain();history.replaceState(null,'','#'+current().inquiry_id);window.scrollTo(0,0)}
function refilter(){renderNav();if(!visible.length){$('main').innerHTML='<p class="empty">没有符合筛选条件的样本，请调整左侧筛选。</p>';return}if(!visible.includes(selected))selectSample(visible[0]);else renderMain()}
function saveNote(){notes[current().inquiry_id]={seen:$('seen').checked,note:$('note').value};try{localStorage.setItem(STORAGE,JSON.stringify(notes));$('save-state').textContent='已保存在当前浏览器'}catch(e){$('save-state').textContent='浏览器无法保存备注'}renderNav()}
function candidateFor(context){const[model,rank]=context.split(':');return current()[model].candidates.find(c=>c.rank===Number(rank))}
function imageMeta(key){const im=DATA.images[key];return `${esc(sourceName(key))} · ${im.width} × ${im.height}<br><span class="mono">${esc(im.filename)}</span> · <a href="${imageUrl(key,true)}" target="_blank" rel="noopener">在新窗口看原图</a>`}
function updateZoom(){const q=current().query_images[Number($('zoom-query-select').value)||0];$('zoom-query').src=imageUrl(q,true);$('zoom-query-meta').innerHTML=imageMeta(q);if(zoomKeys.length){const key=zoomKeys[zoomIndex];$('zoom-gallery').src=imageUrl(key,true);$('zoom-gallery-meta').innerHTML=imageMeta(key);$('zoom-gallery-select').value=String(zoomIndex)}}
function openZoom(context,index=0){const s=current();let queryIndex=0,single=context==='query';if(context==='reference')zoomKeys=s.reference_images;else if(single){zoomKeys=[];queryIndex=index}else{const c=candidateFor(context);zoomKeys=c.images;queryIndex=(c.image_query_indexes[index]||c.query_indexes)[0]||0}zoomIndex=index;document.querySelectorAll('.zoom-image-box').forEach(n=>n.classList.remove('actual'));$('actual').textContent='查看原始尺寸';$('zoom').classList.toggle('zoom-single',single);$('zoom-title').textContent=single?'询码现场图片放大':`询码图片与${context==='reference'?'正确配件参考图':context.startsWith('dino')?' DINOv2 匹配图':' SigLIP 匹配图'}对照`;$('zoom-query-select').innerHTML=s.query_images.map((k,i)=>`<option value="${i}">询码图 ${i+1}</option>`).join('');$('zoom-query-select').value=String(queryIndex);$('zoom-gallery-select').innerHTML=zoomKeys.map((k,i)=>`<option value="${i}">图库图 ${i+1}</option>`).join('');$('prev-image').disabled=$('next-image').disabled=zoomKeys.length<=1;updateZoom();$('zoom').showModal()}
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.sample!==undefined){selectSample(Number(target.dataset.sample));return}if(target.dataset.image){openZoom(target.dataset.context,Number(target.dataset.position));return}if(target.dataset.compare){openZoom(target.dataset.compare);return}if(target.dataset.toggleModel){const model=target.dataset.toggleModel;limits[model]=limits[model]===5?20:5;$('retrievals').innerHTML=renderModel('dino')+renderModel('siglip');return}if(target.dataset.locate){const model=target.dataset.locate;limits[model]=20;$('retrievals').innerHTML=renderModel('dino')+renderModel('siglip');const card=$(`${model}-candidate-${current()[model].rank}`);$(model+'-list').scrollTop=card.offsetTop-$(model+'-list').offsetTop;return}if(target.id==='toggle-reference'){referenceAll=!referenceAll;$('references').innerHTML=renderReferences();return}if(target.id==='previous'||target.id==='next'){const offset=target.id==='previous'?-1:1;const i=visible.indexOf(selected)+offset;if(i>=0&&i<visible.length)selectSample(visible[i])}});
$('search').oninput=refilter;$('group').onchange=refilter;$('review-filter').onchange=refilter;
document.addEventListener('input',e=>{if(e.target.id==='note')saveNote()});document.addEventListener('change',e=>{if(e.target.id==='seen'){saveNote();if($('review-filter').value!=='all')refilter()}});
$('close-zoom').onclick=()=>$('zoom').close();$('zoom-query-select').onchange=updateZoom;$('zoom-gallery-select').onchange=()=>{zoomIndex=Number($('zoom-gallery-select').value);updateZoom()};$('prev-image').onclick=()=>{zoomIndex=(zoomIndex-1+zoomKeys.length)%zoomKeys.length;updateZoom()};$('next-image').onclick=()=>{zoomIndex=(zoomIndex+1)%zoomKeys.length;updateZoom()};$('actual').onclick=()=>{const actual=!document.querySelector('.zoom-image-box').classList.contains('actual');document.querySelectorAll('.zoom-image-box').forEach(n=>n.classList.toggle('actual',actual));$('actual').textContent=actual?'适应窗口':'查看原始尺寸'};
$('summary').textContent=`从 ${DATA.total_inquiries} 条全量询码中选取两组各 ${DATA.selected_per_group} 条 · 图库 ${DATA.gallery_parts} 个配件 / ${DATA.gallery_images.toLocaleString()} 张图片 · 点击图片可与询码图并排放大`;
const initial=DATA.samples.findIndex(s=>s.inquiry_id===decodeURIComponent(location.hash.slice(1)));selectSample(initial>=0?initial:0);
window.comparisonReview={data:DATA,selectSample,openZoom,getSelected:()=>selected};
</script>
